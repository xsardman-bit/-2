<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#1C2430; --muted:#6B7685;
  --key:#FFFFFF; --key-alt:#E3E9F1; --op:#DCE7FF; --op-ink:#2457C5;
  --accent:#2F6FED; --accent-ink:#FFFFFF; --ring:#2F6FED; --shadow:rgba(28,36,48,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#18202B; --ink:#EAF0F8; --muted:#8C98A8;
    --key:#212B38; --key-alt:#2B3645; --op:#223559; --op-ink:#A9C4FF;
    --accent:#4B86FF; --accent-ink:#0B1220; --ring:#7FA8FF; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202B; --ink:#EAF0F8; --muted:#8C98A8;
  --key:#212B38; --key-alt:#2B3645; --op:#223559; --op-ink:#A9C4FF;
  --accent:#4B86FF; --accent-ink:#0B1220; --ring:#7FA8FF; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:16px; background:var(--bgi,var(--bg)); background-attachment:fixed; color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.calc{
  width:100%; max-width:360px; background:var(--surface);
  border-radius:24px; padding:16px; box-shadow:0 12px 40px var(--shadow);
}
.screen{
  min-height:112px; padding:12px 8px 16px; text-align:right;
  display:flex; flex-direction:column; justify-content:flex-end; gap:4px; overflow:hidden;
}
.expr{min-height:1.4em; color:var(--muted); font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.value{font-size:48px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; white-space:nowrap; letter-spacing:-.02em}
.value.err{font-size:24px; color:var(--muted)}
.keys{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
button{
  font:inherit; font-size:22px; font-weight:600; height:64px; border:0; border-radius:18px;
  background:var(--key); color:var(--ink); cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--key-alt);
  transition:transform .08s ease, filter .15s ease;
}
button:active{transform:scale(.95)}
button:hover{filter:brightness(.97)}
button:focus-visible{outline:3px solid var(--ring); outline-offset:2px}
button.alt{background:var(--key-alt); box-shadow:none}
button.op{background:var(--op); color:var(--op-ink); box-shadow:none}
button.eq{background:var(--accent); color:var(--accent-ink); box-shadow:none}
.keys{gap:16px 10px; padding-bottom:6px}
.keys button{--c:#FF6B6B; background:var(--c); color:#141A2B; font-family:"Press Start 2P",ui-monospace,monospace; font-size:16px; border-radius:14px; box-shadow:0 6px 0 color-mix(in srgb,var(--c) 60%,#000), inset 0 2px 0 rgba(255,255,255,.45)}
.keys button:nth-child(7n+1){--c:#FF6B6B}
.keys button:nth-child(7n+2){--c:#FFA94D}
.keys button:nth-child(7n+3){--c:#FFD43B}
.keys button:nth-child(7n+4){--c:#69DB7C}
.keys button:nth-child(7n+5){--c:#4DD0E1}
.keys button:nth-child(7n+6){--c:#74A7FF}
.keys button:nth-child(7n){--c:#B197FC}
.keys button:hover{filter:brightness(1.08)}
.keys button:active{transform:translateY(5px); box-shadow:0 1px 0 color-mix(in srgb,var(--c) 60%,#000), inset 0 2px 0 rgba(255,255,255,.45)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
.bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:10px}
.bar input{width:100px; accent-color:var(--accent)}
button.music{flex:none; margin:0; height:36px; padding:0 16px; font-size:13px; border-radius:999px; background:var(--op); color:var(--op-ink); box-shadow:none}
button.music[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
[hidden]{display:none!important}
.wallet{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; font-size:18px; font-weight:700}
.wallet small{color:var(--muted); font-weight:600; font-size:12px; margin-right:auto; margin-left:6px}
button.rst{height:30px; padding:0 12px; font-size:12px; border-radius:999px; background:var(--key-alt); box-shadow:none; color:var(--ink)}
.tabs{display:flex; gap:4px; margin:12px 0 4px; padding:4px; background:var(--key-alt); border-radius:16px}
.tabs button{flex:1 1 auto; height:40px; font-size:12px; padding:0 6px; white-space:nowrap; border-radius:12px; background:transparent; box-shadow:none; color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 2px 8px var(--shadow)}
.reels{display:flex; gap:10px; padding:20px 8px 8px}
.reel{flex:1; height:116px; display:flex; align-items:center; justify-content:center; font-size:60px; border-radius:20px; background:var(--key); box-shadow:inset 0 0 0 1px var(--key-alt), inset 0 10px 18px var(--shadow)}
.reel.spinning span{filter:blur(1.5px)}
.reel.win{box-shadow:inset 0 0 0 3px var(--accent), 0 0 24px var(--accent); animation:pop .5s ease 3}
@keyframes pop{50%{transform:scale(1.08)}}
.msg{min-height:56px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; font-size:17px; padding:8px}
.stat{display:flex; justify-content:space-around; color:var(--muted); font-size:14px; padding-bottom:14px}
button.spin{width:100%; height:64px; font-size:20px; border-radius:18px; background:var(--accent); color:var(--accent-ink); box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000); margin-bottom:6px}
button.spin:active{transform:translateY(5px); box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
button.spin:disabled{opacity:.6; cursor:default}
@media (prefers-reduced-motion:reduce){.reel.win{animation:none}}
@media (prefers-reduced-motion:reduce){.calc.boom{animation:none}}
button.sure{width:100%; height:52px; font-size:16px; border-radius:16px; background:#FFD43B; color:#141A2B; box-shadow:0 5px 0 #B8900A; margin-bottom:6px}
button.sure:active{transform:translateY(4px); box-shadow:0 1px 0 #B8900A}
button.sure:disabled{opacity:.6; cursor:default}
.fx{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:5}
.p{position:absolute; top:-40px; left:var(--x); font-size:var(--s,20px); font-style:normal; animation:fall var(--t) cubic-bezier(.3,.6,.5,1) forwards}
.p.c{width:10px; height:14px; border-radius:2px}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.big{position:absolute; left:50%; top:42%; font-size:48px; font-weight:800; color:var(--accent); text-shadow:0 4px 24px var(--shadow); animation:rise 1.5s ease forwards; transform:translate(-50%,-50%)}
@keyframes rise{from{opacity:0; transform:translate(-50%,-30%) scale(.6)} 20%{opacity:1; transform:translate(-50%,-50%) scale(1.15)} to{opacity:0; transform:translate(-50%,-130%) scale(1)}}
.calc.boom{animation:boom .9s ease}
.calc{color:var(--ink)}
.calc[data-sk] .keys button{color:var(--kt)}
.calc[data-sk] .keys button:nth-child(7n+1){--c:var(--k1)}
.calc[data-sk] .keys button:nth-child(7n+2){--c:var(--k2)}
.calc[data-sk] .keys button:nth-child(7n+3){--c:var(--k3)}
.calc[data-sk] .keys button:nth-child(7n+4){--c:var(--k4)}
.calc[data-sk] .keys button:nth-child(7n+5){--c:var(--k5)}
.calc[data-sk] .keys button:nth-child(7n+6){--c:var(--k6)}
.calc[data-sk] .keys button:nth-child(7n){--c:var(--k7)}
.shop{max-height:min(460px,60vh); overflow-y:auto; padding:0 2px 8px}
.shop h3{margin:14px 4px 8px; font-size:14px; color:var(--muted)}
.row{display:flex; align-items:center; gap:10px; padding:8px; border-radius:14px; background:var(--key); margin-bottom:6px; box-shadow:inset 0 0 0 1px var(--key-alt)}
.sw{display:flex; width:68px; height:32px; border-radius:10px; overflow:hidden; flex:none; box-shadow:inset 0 0 0 1px var(--shadow)}
.sw i{flex:1}
.nm{flex:1; font-weight:600; font-size:15px}
.row button{height:36px; padding:0 12px; font-size:13px; border-radius:12px; background:var(--op); color:var(--op-ink); box-shadow:none; flex:none}
.row button.cur{background:var(--accent); color:var(--accent-ink)}
.row button.cant{opacity:.55}
button.rst[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.bar select{height:36px; padding:0 10px; font:inherit; font-size:13px; font-weight:600; border:0; border-radius:999px; background:var(--key-alt); color:var(--ink); cursor:pointer}
.bar select:focus-visible{outline:3px solid var(--ring); outline-offset:2px}
.bonus{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:4}
.bn{position:absolute; left:0; top:var(--y); width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; pointer-events:auto; touch-action:manipulation; background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.3) 60%,rgba(255,255,255,.12)); box-shadow:inset 0 0 0 2px rgba(255,255,255,.8), 0 6px 18px var(--shadow); animation:fly var(--t) linear forwards}
.bn span{display:block; animation:bob 1.1s ease-in-out infinite alternate}
@keyframes fly{from{transform:translateX(var(--a))} to{transform:translateX(var(--b))}}
@keyframes bob{from{transform:translateY(-12px)} to{transform:translateY(12px)}}
.walker{position:absolute; left:0; top:0; width:56px; height:112px; touch-action:none; cursor:grab; pointer-events:auto; user-select:none; -webkit-user-select:none; transform-origin:50% 100%; will-change:transform}
.walker.grab{cursor:grabbing}
.stage{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:3}
.walker .gun{left:40px; top:46px; width:34px; height:9px; background:linear-gradient(#5A6272 0 55%,#2B2F38 55%); border-radius:2px; transform-origin:0 50%; transform:rotate(var(--ga,0deg))}
.walker .gun::before{content:""; position:absolute; left:9px; top:8px; width:7px; height:13px; background:#2B2F38; border-radius:0 0 2px 2px}
.walker .gun::after{content:""; position:absolute; right:0; top:0; width:5px; height:9px; background:#9AA3B2}
.hud{position:absolute; left:0; top:0; width:76px; font-size:11px; font-weight:700; text-align:center; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8); pointer-events:none; will-change:transform}
.hud .b{height:6px; margin-top:2px; border-radius:3px; background:rgba(0,0,0,.4); overflow:hidden}
.hud .b i{display:block; height:100%; width:100%; background:#4ADE80}
.hud .b + .b i{background:#74A7FF}
.tr{position:absolute; height:3px; border-radius:2px; background:linear-gradient(90deg,#FFF6B0,#FFD43B 40%,rgba(255,212,59,0)); transform-origin:0 50%; animation:trf .11s linear forwards; pointer-events:none}
@keyframes trf{to{opacity:0}}
.mf{position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:radial-gradient(circle,#fff,#FFD43B 60%,transparent 70%); pointer-events:none}
.splat{position:fixed; z-index:7; font-size:38px; pointer-events:none; transform:translate(-50%,-50%) scale(.4); animation:splat 1.2s ease-out forwards}
@keyframes splat{20%{transform:translate(-50%,-50%) scale(1.2)} to{transform:translate(-50%,-50%) scale(1); opacity:0}}
.gain.dmg{color:#FF5C5C}
.gain.xpg{color:#4DA3FF}
.hist{max-height:min(420px,56vh); overflow-y:auto; padding:0 2px 8px}
.hrow{display:flex; align-items:center; gap:10px; padding:10px; border-radius:14px; background:var(--key); margin-bottom:6px; box-shadow:inset 0 0 0 1px var(--key-alt)}
.hk{font-size:18px; flex:none}
.ht{flex:1; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; word-break:break-word}
.hdt{color:var(--muted); font-size:11px; flex:none; text-align:right}
.hempty{color:var(--muted); text-align:center; padding:28px 12px; font-size:14px}
.hclr{display:block; margin:6px auto 0}
.calc.locked > *:not(#authView):not(.bar){display:none!important}
#authView{display:none}
.calc.locked #authView{display:block}
.ah{margin:14px 0 0; font-size:22px; text-align:center}
.seg{display:flex; gap:4px; padding:4px; background:var(--key-alt); border-radius:16px; margin:14px 0 12px}
.seg button{flex:1; height:40px; font-size:14px; border-radius:12px; background:transparent; box-shadow:none; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 2px 8px var(--shadow)}
.fld{width:100%; height:52px; margin-bottom:10px; padding:0 16px; font:inherit; font-size:17px; color:var(--ink); background:var(--key); border:0; border-radius:16px; box-shadow:inset 0 0 0 1px var(--key-alt)}
.fld:focus-visible{outline:3px solid var(--ring); outline-offset:2px}
button.go{width:100%; height:56px; font-size:18px; border-radius:16px; background:var(--accent); color:var(--accent-ink); box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
button.go:active{transform:translateY(4px); box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.amsg{min-height:44px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; font-size:14px; padding:6px}
.anote{color:var(--muted); font-size:12px; text-align:center; padding:0 8px 8px; line-height:1.4}
.acct{display:flex; align-items:center; justify-content:space-between; margin-top:10px; font-weight:700; font-size:14px}
.walker *{position:absolute}
.walker .hd{left:12px; top:0; width:32px; height:32px; background:#E0A96D; box-shadow:inset 0 9px 0 #1C1C1C, inset 0 -3px 0 rgba(0,0,0,.1)}
.walker .hd::before{content:""; left:0; top:9px; width:32px; height:5px; background:#D93A3A}
.walker .ey{top:17px; width:5px; height:5px; background:#222; left:7px}
.walker .ey.r{left:20px}
.walker .bd{left:12px; top:32px; width:32px; height:44px; background:#E8782A; box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.walker .ar{top:32px; width:12px; height:44px; background:linear-gradient(#E8782A 0 55%,#E0A96D 55%); transform-origin:50% 4px}
.walker .ar.l{left:0}
.walker .ar.r{left:44px}
.walker .lg{top:76px; width:15px; height:36px; background:linear-gradient(#2F6B3E 0 78%,#F2F2F2 78%); transform-origin:50% 0}
.walker .lg.l{left:12px}
.walker .lg.r{left:29px}
.walker.walk .ar.l,.walker.walk .lg.r{animation:swing .5s ease-in-out infinite alternate}
.walker.walk .ar.r,.walker.walk .lg.l{animation:swing .5s ease-in-out infinite alternate-reverse}
.walker.fly .ar.l,.walker.fly .lg.r{animation:swing .18s ease-in-out infinite alternate}
.walker.fly .ar.r,.walker.fly .lg.l{animation:swing .18s ease-in-out infinite alternate-reverse}
@keyframes swing{from{transform:rotate(28deg)} to{transform:rotate(-28deg)}}
@keyframes stroll{0%{transform:translateX(-80px) scaleX(1)} 49.9%{transform:translateX(calc(100vw + 20px)) scaleX(1)} 50%{transform:translateX(calc(100vw + 20px)) scaleX(-1)} 99.9%{transform:translateX(-80px) scaleX(-1)} 100%{transform:translateX(-80px) scaleX(1)}}
@media (prefers-reduced-motion:reduce){.walker .ar,.walker .lg{animation:none!important}}
.gain{position:fixed; z-index:6; font-weight:800; font-size:22px; color:var(--accent); text-shadow:0 2px 10px var(--shadow); pointer-events:none; transform:translate(-50%,-50%); animation:up .9s ease forwards}
@keyframes up{to{transform:translate(-50%,-170%); opacity:0}}
@keyframes boom{0%{box-shadow:0 12px 40px var(--shadow)} 30%{box-shadow:0 0 0 4px var(--accent), 0 0 60px var(--accent); transform:scale(1.03)} 100%{box-shadow:0 12px 40px var(--shadow)}}
.calc{position:relative; z-index:1}
.sky{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
.o{position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s); animation:drift var(--t) ease-in-out var(--dl) infinite alternate}
.o.c{border-radius:50%; background:var(--op)}
.o.q{border-radius:28%; background:var(--accent); opacity:.2}
.o.r{border-radius:50%; border:5px solid var(--accent); opacity:.3}
.o.s{border-radius:34%; background:var(--key-alt)}
@keyframes drift{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(34px,-56px) rotate(160deg)}}
@media (prefers-reduced-motion:reduce){.o{animation:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  
  <i class="o c" style="--x:8%;--y:12%;--s:70px;--t:9s;--dl:0s"></i>
  <i class="o q" style="--x:82%;--y:10%;--s:54px;--t:11s;--dl:-3s"></i>
  <i class="o r" style="--x:20%;--y:70%;--s:84px;--t:13s;--dl:-5s"></i>
  <i class="o s" style="--x:74%;--y:64%;--s:96px;--t:10s;--dl:-2s"></i>
  <i class="o q" style="--x:3%;--y:44%;--s:40px;--t:8s;--dl:-6s"></i>
  <i class="o c" style="--x:90%;--y:40%;--s:36px;--t:12s;--dl:-4s"></i>
  <i class="o r" style="--x:60%;--y:86%;--s:48px;--t:9s;--dl:-1s"></i>
  <i class="o s" style="--x:44%;--y:4%;--s:44px;--t:14s;--dl:-7s"></i>
</div>
<div class="stage" id="stage" aria-hidden="true"><div class="walker" id="walker"><div class="ar l"></div><div class="lg l"></div><div class="lg r"></div><div class="bd"></div><div class="ar r"></div><div class="hd"><i class="ey"></i><i class="ey r"></i></div><div class="gun"></div></div></div>
<div class="bonus" id="bonus" aria-hidden="true"></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<main class="calc locked" aria-label="Калькулятор">
  <div class="bar">
    <span aria-hidden="true">🔊</span>
    <input type="range" id="vol" min="0" max="100" value="40" aria-label="Громкость">
    <select id="trk" aria-label="Выбор музыки">
      <option value="0">Трэп-бит</option>
      <option value="1">Латино</option>
      <option value="2">Чиптюн</option>
      <option value="3">Лоу-фай</option>
      <option value="4">Диско</option>
    </select>
    <button class="music" id="music" aria-pressed="false">♪ Музыка: выкл</button>
  </div>
  <div id="authView">
    <h2 class="ah">Вход в аккаунт</h2>
    <div class="seg" role="group" aria-label="Режим входа">
      <button id="segLogin" aria-pressed="true">Войти</button>
      <button id="segReg" aria-pressed="false">Регистрация</button>
    </div>
    <input class="fld" id="lg" type="text" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Логин" aria-label="Логин">
    <input class="fld" id="pw" type="password" maxlength="64" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль">
    <button class="go" id="goBtn">Войти</button>
    <div class="amsg" id="amsg" role="status" aria-live="polite"></div>
    <div class="anote" id="anote"></div>
  </div>
  <div class="acct"><span id="who"></span><button class="rst" id="logout">Выйти</button></div>
  <div class="wallet">
    <span aria-hidden="true">🪙</span><b id="coins" aria-live="polite">50</b>
    <small>1 🪙 за действие</small>
    <button class="rst" id="gun" aria-pressed="true">🔫 Бой: вкл</button>
    <button class="rst" id="inf" aria-pressed="false" title="Бесконечные деньги">∞ Деньги</button>
    <button class="rst" id="reset">Сбросить</button>
  </div>
  <div class="tabs" role="group" aria-label="Режим">
    <button id="tabCalc" aria-pressed="true">🧮 Счёт</button>
    <button id="tabSlots" aria-pressed="false">🍒 Слоты</button>
    <button id="tabShop" aria-pressed="false">🛒 Магазин</button>
    <button id="tabHist" aria-pressed="false">📜 История</button>
  </div>
  <div id="calcView">
  <div class="screen">
    <div class="expr" id="expr"></div>
    <div class="value" id="value" role="status" aria-live="polite">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="alt" data-k="clear" aria-label="Сбросить">AC</button>
    <button class="alt" data-k="back" aria-label="Стереть символ">⌫</button>
    <button class="alt" data-k="pct" aria-label="Процент">%</button>

    var login=document.getElementById('lg').value.trim(), pw=document.getElementById('pw').value, key;
    if(!/^[A-Za-z0-9_.а-яА-ЯёЁ-]{3,20}$/.test(login)){ amsg('Логин: 3–20 символов — буквы, цифры, _ . -'); return; }
    if(pw.length<4||pw.length>64){ amsg('Пароль: от 4 до 64 символов'); return; }
    if(!window.crypto||!crypto.subtle){ amsg('Браузер не поддерживает шифрование паролей'); return; }
    abusy=true; amsg('Проверяем…');
    authReady.then(function(){ return keyOf(login); }).then(function(k){
      key=k; return sGet('accounts/'+k);
    }).then(function(acc){
      if(authMode==='reg'){
        if(acc){ amsg('Такой логин уже занят'); return; }
        var salt=crypto.getRandomValues(new Uint8Array(16));
        return hashPw(pw,salt).then(function(h){
          return sSet('accounts/'+key,{login:login,salt:b64(salt),hash:h,created:Date.now()});
        }).then(function(){ return enter(login,key); });
      }
      if(!acc){ amsg('Аккаунт не найден'); return; }
      return hashPw(pw,unb64(acc.salt)).then(function(h){
        if(h!==acc.hash){ amsg('Неверный пароль'); return; }
        return enter(login,key);
      });
    }).catch(function(){ amsg('Что-то пошло не так, попробуйте ещё раз'); }).then(function(){ abusy=false; });
  }
  function initAuth(){
    authReady=(window.claude&&claude.use?claude.use('db'):Promise.resolve(null)).then(function(d){ sdb=d||null; }).catch(function(){ sdb=null; }).then(function(){
      document.getElementById('anote').textContent=sdb?'Аккаунты хранятся в базе данных. Не используйте настоящие пароли: это игровой аккаунт.':'База данных недоступна: аккаунт сохранится только в этом браузере. Не используйте настоящие пароли.';
    });
    document.getElementById('segLogin').addEventListener('click',function(){ setMode('login'); });
    document.getElementById('segReg').addEventListener('click',function(){ setMode('reg'); });
    document.getElementById('goBtn').addEventListener('click',submitAuth);
    ['lg','pw'].forEach(function(id){
      document.getElementById(id).addEventListener('keydown',function(e){ if(e.key==='Enter') submitAuth(); });
    });
    document.getElementById('logout').addEventListener('click',logout);
    try{ var l=localStorage.getItem('cal:last'); if(l) document.getElementById('lg').value=l; }catch(x){}
    setMode('login');
  }
  initAuth();
  wk.addEventListener('pointerup',release);
  wk.addEventListener('pointercancel',release);
  wy=gnd(); limbs(still?'':'walk');
  requestAnimationFrame(frame);
  btnSpin.addEventListener("click",function(){ spin(false); });
  btnSure.addEventListener("click",function(){ spin(true); });
  function fanfare(){
    if(!ac) return;
    var t=ac.currentTime, o=master;
    if(mus&&playing){ mus.gain.value=0.25; setTimeout(function(){ if(playing) mus.gain.value=1; },3200); }
    [[72,0],[76,0.1],[79,0.2],[84,0.3],[79,0.46],[84,0.56],[88,0.66]].forEach(function(n){ note(n[0],t+n[1],0.14,"square",0.4,o); });
    [84,88,91,96].forEach(function(m){ note(m,t+0.95,1.1,"square",0.25,o); });
    note(48,t+0.95,1.2,"triangle",0.9,o); note(55,t+0.95,1.2,"triangle",0.7,o);
    for(var i=0;i<10;i++){
      noise(t+0.95+i*0.08,0.12,0.18,6000,o);
      note(96+(i%4)*3,t+1+i*0.08,0.09,"triangle",0.3,o);
    }
  }
  function celebrate(){
    var fx=document.getElementById("fx");
    var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
    var big=document.createElement("div"); big.className="big"; big.textContent="+10 🪙"; fx.appendChild(big);
    if(!calm){
      var cols=["#FF6B6B","#FFA94D","#FFD43B","#69DB7C","#4DD0E1","#74A7FF","#B197FC"];
      var em=["🪙","🪙","🎉","✨","🍒","🍋","🍉","🍇","🍊"];
      for(var i=0;i<56;i++){
        var p=document.createElement("i");
        p.className="p";
        p.style.setProperty("--x",(Math.random()*100)+"%");
        p.style.setProperty("--dx",(Math.random()*160-80)+"px");
        p.style.setProperty("--r",(Math.random()*720-360)+"deg");
        p.style.setProperty("--t",(1.8+Math.random()*1.6)+"s");
        if(i%3===0){
          p.style.setProperty("--s",(22+Math.random()*18)+"px");
          p.textContent=em[Math.floor(Math.random()*em.length)];
        } else {
          p.className="p c"; p.style.background=cols[i%cols.length];
        }
        fx.appendChild(p);
      }
      var c=document.querySelector(".calc");
      c.classList.remove("boom"); void c.offsetWidth; c.classList.add("boom");
    }
    setTimeout(function(){ fx.innerHTML=""; },3600);
  }
  var coins=50, coinsEl=document.getElementById("coins");
  var inf=false, saved=50;
  function setCoins(n){ if(inf) return; coins=n; coinsEl.textContent=n; pSave(); }
  function setInf(on){
    if(on===inf) return;
    var b=document.getElementById("inf");
    if(on){ saved=coins; inf=true; coins=Infinity; coinsEl.textContent="∞"; if(err){ err=null; render(); } if(ensure()){ note(84,ac.currentTime,0.07,"square",0.4,master); note(91,ac.currentTime+0.07,0.07,"square",0.4,master); note(96,ac.currentTime+0.14,0.3,"square",0.4,master); } }
    else { inf=false; coins=saved; coinsEl.textContent=coins; }
    b.setAttribute("aria-pressed",on?"true":"false");
    b.textContent=on?"∞ Включено":"∞ Деньги";
    if(!document.getElementById("shopView").hidden) renderShop();
  }
  document.getElementById("inf").addEventListener("click",function(){ setInf(!inf); });
  function charge(){
    if(coins<1){ err="Нет денег 🪙"; return false; }
    setCoins(coins-1); return true;
  }
  document.getElementById("reset").addEventListener("click",function(){
    setInf(false); setCoins(50);
    if(err){ err=null; render(); }
    elM.textContent="Баланс сброшен: 50 🪙";
  });
  document.getElementById("vol").addEventListener("input",function(e){
    vol=+e.target.value; if(master) master.gain.value=vol/100*0.3;
  });
  function setMusic(on){
    if(on){
      if(!ensure()) return;
      mus.gain.value=1; nextT=ac.currentTime+0.05; step=0;
      clearInterval(timer); timer=setInterval(tick,30);
    } else {
      clearInterval(timer); if(mus) mus.gain.value=0;
    }
    playing=on;
    var b=document.getElementById("music");
    b.setAttribute("aria-pressed",on?"true":"false");
    b.textContent=on?"♪ Музыка: вкл":"♪ Музыка: выкл";
  }
  document.getElementById("music").addEventListener("click",function(){ setMusic(!playing); });
  document.addEventListener("visibilitychange",function(){
    if(!ac||!playing) return;
    if(document.hidden) ac.suspend(); else ac.resume();
  });
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey||!user||document.getElementById("calcView").hidden||(e.target.closest(".tabs,.bar,.wallet")&&(e.key==="Enter"||e.key===" "))) return;
    var k=e.key, m={"+":"+","-":"\u2212","*":"\u00D7","/":"\u00F7","x":"\u00D7"};
    if(/^\d$/.test(k)) press(k);
    else if(k==="."||k===",") press("dot");
    else if(m[k]){ e.preventDefault(); press(m[k]); }
    else if(k==="Enter"||k==="="){ e.preventDefault(); press("eq"); }
    else if(k==="Backspace") press("back");
    else if(k==="Escape"||k==="Delete") press("clear");
    else if(k==="%") press("pct");
  });
  render();
})();
</script>
</body>
